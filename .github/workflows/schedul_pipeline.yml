name: Update Schedule Pipeline

on:
  schedule:
    # Пн-Сб: 13:30 - 13:50 МСК (10:30 - 10:50 UTC), минуты сдвинуты с «круглых»
    - cron: '33,43,53 10 * * 1-6'

    # Пн-Сб: 14:00 - 15:50 МСК (11:00 - 12:50 UTC)
    - cron: '3,13,23,33,43,53 11-12 * * 1-6'

    # Пн-Сб: 16:00 - 16:30 МСК (13:00 - 13:30 UTC)
    - cron: '3,13,23,33 13 * * 1-6'

  workflow_dispatch:

# Защита от параллельных запусков, чтобы не было конфликтов при git push
concurrency:
  group: update-schedule
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Download schedule from VK
        env:
          VK_SERVICE_TOKEN: ${{ secrets.VK_SERVICE_TOKEN }}
        run: |
          python vk_downloader.py -d nk_knn -r "3.4 курс" --days 10

      - name: Parse Schedule PDF
        run: |
          # Автоматически сохраняем расписания за последние 10 дней, удаляем дубликаты и старые файлы (> 10 дней)
          python parse_schedule.py downloads/ -o schedule.json --retention-days 10 --clean-files --as-list

      - name: Push schedule to Cloudflare KV
        env:
          WORKER_URL: ${{ secrets.CF_WORKER_URL }}
          API_SECRET: ${{ secrets.CF_API_SECRET }}
        run: |
          curl --fail-with-body -X POST "$WORKER_URL" \
            -H "Authorization: Bearer $API_SECRET" \
            -H "Content-Type: application/json" \
            --data-binary @schedule.json

      - name: Commit and push updated downloads
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A downloads/
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update schedule (retain last 10 days) [skip ci]"
            git pull --rebase
            git push
          fi