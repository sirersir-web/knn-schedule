name: Update Schedule Pipeline

on:
  schedule:
    # Пн-Сб: 13:30 - 13:50 МСК (10:30 - 10:50 UTC) каждые 10 минут
    - cron: '30,40,50 10 * * 1-6'

    # Пн-Сб: 14:00 - 15:50 МСК (11:00 - 12:50 UTC) каждые 10 минут
    - cron: '*/10 11-12 * * 1-6'

    # Пн-Сб: 16:00 - 16:30 МСК (13:00 - 13:30 UTC) каждые 10 минут
    - cron: '0,10,20,30 13 * * 1-6'

  workflow_dispatch:


jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Download schedule from VK
        env:
          VK_SERVICE_TOKEN: ${{ secrets.VK_SERVICE_TOKEN }}
        run: |
          python vk_downloader.py -d nk_knn -r "3.4 курс"

      - name: Parse Schedule PDF
        run: |
          # Автоматически сохраняем расписания за последние 10 дней, удаляем дубликаты и старые файлы (> 10 дней)
          python parse_schedule.py downloads/ -o schedule.json --retention-days 10 --clean-files --as-list

      - name: Push schedule to Cloudflare KV
        env:
          WORKER_URL: ${{ secrets.CF_WORKER_URL }}
          API_SECRET: ${{ secrets.CF_API_SECRET }}
        run: |
          curl -X POST "$WORKER_URL" \
            -H "Authorization: Bearer $API_SECRET" \
            -H "Content-Type: application/json" \
            --data-binary @schedule.json

      - name: Commit and push updated downloads
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add downloads/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update schedule (retain last 10 days) [skip ci]" && git push)
